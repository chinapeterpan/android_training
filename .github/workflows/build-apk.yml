name: 构建 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 设置 Gradle 镜像加速
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/public' }
                  google()
                  mavenCentral()
              }
          }
          settingsEvaluated { settings ->
              settings.pluginManagement {
                  repositories {
                      maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                      maven { url 'https://maven.aliyun.com/repository/google' }
                      maven { url 'https://maven.aliyun.com/repository/public' }
                      gradlePluginPortal()
                      google()
                  }
              }
          }
          EOF

      - name: 授予 Gradle 执行权限
        run: chmod +x ./gradlew

      # 用 continue-on-error 让构建失败不中断流程，
      # 这样后面的诊断步骤一定会执行，错误信息也一定会出现在运行日志里。
      - name: 构建 debug APK
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo ">>> Gradle 退出码: $code"
          if [ "$code" -ne 0 ]; then
            echo ">>> 构建失败，关键错误："
            grep -iE "what went wrong|error:|exception|caused by|failed|could not|A problem occurred|BUILD FAILED" build.log | head -25 || true
            echo ">>> 日志末尾："
            tail -30 build.log
          else
            echo ">>> 构建成功，输出文件："
            find . -name "*.apk" -not -path "./.git/*" 2>/dev/null || true
          fi

      # 把错误原样打到运行日志，页面直接可见，不需要下载任何文件
      - name: 显示构建错误
        if: failure()
        run: |
          echo "::group::构建失败，以下是完整错误日志"
          cat build.log || echo "(无 build.log)"
          echo "::endgroup::"
          {
            echo "## 构建失败"
            echo '```'
            grep -iE "what went wrong|error:|exception|caused by|failed|could not|not found|unresolved|A problem occurred" build.log | head -30 || echo "(未匹配到错误行)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 无论成败都收集环境与配置信息，方便排查
      - name: 收集诊断信息
        if: always()
        run: |
          mkdir -p diag
          {
            echo "===== Java ====="
            java -version 2>&1
            echo "===== gradlew 权限 ====="
            ls -l ./gradlew
            echo "===== 关键文件 ====="
            ls -la build.gradle settings.gradle gradle.properties \
                    app/build.gradle app/src/main/AndroidManifest.xml 2>&1
            echo "===== 图标 PNG 校验 ====="
            for f in app/src/main/res/mipmap-*/ic_launcher.png; do
              echo "$f : $(stat -c%s "$f") bytes"
            done
            echo "===== assets 清单 ====="
            ls -la app/src/main/assets/www/ 2>&1 | head -30
            echo "===== assets 总体积 ====="
            du -sh app/src/main/assets/www/ 2>&1
            echo "===== Gradle 包装器 ====="
            ls -la gradle/wrapper/
            cat gradle/wrapper/gradle-wrapper.properties
            echo "===== build.log 末尾 ====="
            tail -60 build.log 2>/dev/null || echo "(无build.log)"
          } > diag/info.txt 2>&1
          cat diag/info.txt

      # 找出 APK 实际路径并放进 apk-out/，
      # 避免因路径不对导致上传步骤静默跳过
      - name: 定位 APK
        if: always()
        run: |
          mkdir -p apk-out
          echo "===== app/build 目录结构 ====="
          ls -la app/build/ 2>&1 || echo "(无 app/build)"
          echo "===== outputs 目录 ====="
          ls -laR app/build/outputs/ 2>&1 | head -50 || echo "(无 outputs 目录)"
          echo "===== 全局查找 apk ====="
          find . -name "*.apk" -not -path "./.git/*" 2>/dev/null | head -20 | tee apk-list.txt
          APK=$(find . -name "*.apk" -not -path "./.git/*" 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" apk-out/app-debug.apk
            echo "已找到并复制: $APK"
            ls -la apk-out/
          else
            echo ">>> 未找到任何 APK"
            echo ">>> 检查 assembleDebug 是否真的产出了安装包"
          fi

      # 无论成败都上传诊断包：下载它不需要仓库管理员权限
      - name: 上传诊断日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            diag/
            build.log
            apk-list.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: 上传 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: count-to-10-apk
          path: apk-out/app-debug.apk
          retention-days: 90
          if-no-files-found: warn
