name: 构建 APK

# 触发时机：手动触发，或往main 分支推送时自动构建
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 关键：Windows 上提交的脚本不带可执行位，Linux 上会报
      # "./gradlew: Permission denied"（退出码 126）。这里强制加上。
      - name: 赋予 gradlew 执行权限
        run: |
          chmod +x ./gradlew
          ls -l ./gradlew

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 缓存 Gradle 与依赖，第二次构建会快很多
      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 设置 Gradle 镜像加速
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/public' }
                  google()
                  mavenCentral()
              }
          }
          settingsEvaluated { settings ->
              settings.pluginManagement {
                  repositories {
                      maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                      maven { url 'https://maven.aliyun.com/repository/google' }
                      maven { url 'https://maven.aliyun.com/repository/public' }
                      gradlePluginPortal()
                      google()
                  }
              }
          }
          EOF

      # 用 bash 显式解释执行，不依赖文件自身的可执行位
      - name: 构建 debug APK
        run: |
          set -e
          bash ./gradlew assembleDebug --no-daemon --stacktrace \
            || {
              echo "===== 构建失败，以下是详细日志 ====="
              ls -la ./gradlew || true
              ls -la gradle/wrapper/ || true
              echo "--- Java 版本 ---"
              java -version
              echo "--- ANDROID_HOME ---"
              echo "${ANDROID_HOME:-未设置}"
              echo "--- assets 目录 ---"
              ls -la app/src/main/assets/www/ | head -30
              exit 1
            }

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: count-to-10-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
