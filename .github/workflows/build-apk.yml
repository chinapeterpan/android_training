name: 构建 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 设置 Gradle 镜像加速
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/public' }
                  google()
                  mavenCentral()
              }
          }
          settingsEvaluated { settings ->
              settings.pluginManagement {
                  repositories {
                      maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                      maven { url 'https://maven.aliyun.com/repository/google' }
                      maven { url 'https://maven.aliyun.com/repository/public' }
                      gradlePluginPortal()
                      google()
                  }
              }
          }
          EOF

      - name: 授予 Gradle 执行权限
        run: chmod +x ./gradlew

      # 失败时把关键日志写到 Actions 页面顶部，
      # 避免只能靠管理员权限下载完整日志才能定位问题。
      - name: 构建 debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            {
              echo "## 构建失败摘要"
              echo ""
              echo "### 错误行"
              echo '```'
              grep -iE "what went wrong|error:|exception|caused by|failed|could not|not found|unresolved" build.log | head -30 || echo "(未匹配到错误行)"
              echo '```'
              echo ""
              echo "### 日志末尾"
              echo '```'
              tail -40 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: count-to-10-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
