name: 构建 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      # 允许把构建报告 commit 回仓库，便于排查
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 设置 Gradle 镜像加速
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/public' }
                  google()
                  mavenCentral()
              }
          }
          settingsEvaluated { settings ->
              settings.pluginManagement {
                  repositories {
                      maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                      maven { url 'https://maven.aliyun.com/repository/google' }
                      maven { url 'https://maven.aliyun.com/repository/public' }
                      gradlePluginPortal()
                      google()
                  }
              }
          }
          EOF

      - name: 授予 Gradle 执行权限
        run: chmod +x ./gradlew

      # 用 continue-on-error 让构建失败不中断流程，
      # 这样后面的诊断步骤一定会执行，错误信息也一定会出现在运行日志里。
      - name: 构建 debug APK
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo ">>> Gradle 退出码: $code"
          if [ "$code" -ne 0 ]; then
            echo ">>> 构建失败，关键错误："
            grep -iE "what went wrong|error:|exception|caused by|failed|could not|A problem occurred|BUILD FAILED" build.log | head -25 || true
            echo ">>> 日志末尾："
            tail -30 build.log
          else
            echo ">>> 构建成功，输出文件："
            find . -name "*.apk" -not -path "./.git/*" 2>/dev/null || true
          fi

      # 把错误原样打到运行日志，页面直接可见，不需要下载任何文件
      - name: 显示构建错误
        if: failure()
        run: |
          echo "::group::构建失败，以下是完整错误日志"
          cat build.log || echo "(无 build.log)"
          echo "::endgroup::"
          {
            echo "## 构建失败"
            echo '```'
            grep -iE "what went wrong|error:|exception|caused by|failed|could not|not found|unresolved|A problem occurred" build.log | head -30 || echo "(未匹配到错误行)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 无论成败都收集环境与配置信息，方便排查
      - name: 收集诊断信息
        if: always()
        run: |
          mkdir -p diag
          {
            echo "===== Java ====="
            java -version 2>&1
            echo "===== gradlew 权限 ====="
            ls -l ./gradlew
            echo "===== 关键文件 ====="
            ls -la build.gradle settings.gradle gradle.properties \
                    app/build.gradle app/src/main/AndroidManifest.xml 2>&1
            echo "===== 图标 PNG 校验 ====="
            for f in app/src/main/res/mipmap-*/ic_launcher.png; do
              echo "$f : $(stat -c%s "$f") bytes"
            done
            echo "===== assets 清单 ====="
            ls -la app/src/main/assets/www/ 2>&1 | head -30
            echo "===== assets 总体积 ====="
            du -sh app/src/main/assets/www/ 2>&1
            echo "===== Gradle 包装器 ====="
            ls -la gradle/wrapper/
            cat gradle/wrapper/gradle-wrapper.properties
            echo "===== build.log 末尾 ====="
            tail -60 build.log 2>/dev/null || echo "(无build.log)"
          } > diag/info.txt 2>&1
          cat diag/info.txt

      # 把构建结果写进产物文件名，这样不下载也能从Actions 页面看到成败
      - name: 定位 APK
        if: always()
        run: |
          mkdir -p apk-out
          APK=$(find . -name "*.apk" -not -path "./.git/*" 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" apk-out/app-debug.apk
            SIZE=$(du -h apk-out/app-debug.apk | cut -f1)
            echo "APK_SIZE=$SIZE" >> "$GITHUB_ENV"
            echo "✅ 找到 APK: $APK（$SIZE）"
            echo "### ✅ 构建成功，APK 大小 $SIZE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "APK_SIZE=none" >> "$GITHUB_ENV"
            echo "❌ 未产出 APK"
            echo "### ❌ 未产出 APK" >> "$GITHUB_STEP_SUMMARY"
            echo "### Gradle 日志末尾" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -30 build.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      # 把构建结果 commit 回仓库，这样无需下载任何文件，
      # 直接访问仓库就能看到 gradle 到底报了什么。
      - name: 提交构建报告
        if: always()
        run: |
          mkdir -p report
          {
            echo "# 构建报告"
            echo ""
            echo "提交: \`${GITHUB_SHA}\`"
            echo "时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "## 结果"
            if [ -f apk-out/app-debug.apk ]; then
              echo "✅ 成功产出 APK（$(du -h apk-out/app-debug.apk | cut -f1)）"
            else
              echo "❌ 未产出 APK"
            fi
            echo ""
            echo "## Gradle 日志（末尾 80 行）"
            echo '```'
            tail -80 build.log 2>/dev/null || echo "(无 build.log)"
            echo '```'
            echo ""
            echo "## 环境"
            echo '```'
            java -version 2>&1
            echo "--- gradlew ---"
            ls -l ./gradlew
            echo "--- AndroidManifest ---"
            ls -la app/src/main/AndroidManifest.xml
            echo "--- 图标 ---"
            ls -la app/src/main/res/mipmap-*/ic_launcher.png
            echo "--- assets ---"
            ls -la app/src/main/assets/www/ | head -25
            echo '```'
          } > report/BUILD_REPORT.md
          cat report/BUILD_REPORT.md
          # 只提交报告文件，不动其他内容
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/BUILD_REPORT.md
          git commit -m "chore: 更新构建报告 ${GITHUB_SHA:0:7}" || echo "(无变更可提交)"
          git push || echo "(推送失败，可能是权限不足)"

      - name: 上传 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: count-to-10-apk
          path: apk-out/app-debug.apk
          retention-days: 90
          if-no-files-found: warn
