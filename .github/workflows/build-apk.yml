name: 构建 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # GitHub 官方给出的解决方案：
      # Windows 提交时不会保留可执行位，Linux runner 按 Git 记录的模式执行，
      # 因此必须在运行前手动赋予权限。
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 国内镜像已在 settings.gradle 配好，无需额外的 init script
      - name: 构建 debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: count-to-10-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
