plugins {
    id 'com.android.application'
}

android {
    namespace 'com.countto10'
    compileSdk 34

    defaultConfig {
        applicationId "com.countto10"
        // 24 = Android 7.0，覆盖绝大多数 OPPO 机型
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // AGP 8.x 已移除旧的 aaptOptions { noCompress }，改用 androidResources。
    // 模型分片（model.bin.part0）内容已是 gzip 压缩过的，
    // 若被 aapt 再压一次会极慢且无意义，因此排除压缩。
    androidResources {
        noCompress += 'part'
    }

    buildTypes {
        debug {
            // 用默认 debug 签名即可自用安装，无需自建证书
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // WebViewAssetLoader：把 assets 映射成 https 虚拟域名，
    // 否则页面里的 fetch() 读模型分片会被跨源策略拦死
    implementation 'androidx.webkit:webkit:1.11.0'
}
