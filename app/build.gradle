plugins {
    id 'com.android.application'
}

android {
    namespace 'com.countto10'
    compileSdk 34

    defaultConfig {
        applicationId "com.countto10"
        // 24 = Android 7.0，覆盖绝大多数 OPPO 机型
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // 模型分片已压缩过（.gz 内容），不能再压一遍，否则构建极慢甚至失败。
    // 注意：文件实际是 model.bin.part0 这种命名，aapt 的 noCompress 只按
    // 完整扩展名匹配，所以必须写 'part'，写 'bin' 不生效。
    aaptOptions {
        noCompress 'part'
    }

    buildTypes {
        debug {
            // 用默认 debug 签名即可自用安装，无需自建证书
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        // 模型分片较大，交给系统按需处理
        jniLibs {
            useLegacyPackaging false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // WebViewAssetLoader：把 assets 映射成 https 虚拟域名，
    // 否则页面里的 fetch() 读模型分片会被跨源策略拦死
    implementation 'androidx.webkit:webkit:1.11.0'
}
