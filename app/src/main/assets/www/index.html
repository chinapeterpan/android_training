<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0F6E56">
<title>报数挑战 · 数到 10</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0b1512;
    color: #E1F5EE;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
    user-select: none;
    overflow: hidden;
  }
  #confetti {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 100;
  }
  header { text-align: center; padding: 18px 0 6px; }
  h1 { font-size: 17px; font-weight: 500; letter-spacing: .5px; }
  .sub { font-size: 12px; color: #6d8c82; margin-top: 4px; }

  .counter {
    margin: 14px 0 4px;
    font-size: 92px; font-weight: 500; line-height: 1;
    color: #9FE1CB; font-variant-numeric: tabular-nums;
    transition: transform .18s ease, color .18s ease;
  }
  .counter.pop { transform: scale(1.18); color: #EF9F27; }

  .expect {
    font-size: 14px; color: #5DCAA5; height: 22px;
    margin-bottom: 10px;
  }
  .expect b { color: #EF9F27; font-weight: 500; }

  .dots { display: flex; gap: 6px; margin: 6px 0 14px; flex-wrap: wrap; justify-content: center; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #24443b; transition: background .2s, transform .2s;
  }
  .dot.on { background: #5DCAA5; transform: scale(1.15); }
  .dot.next { background: #EF9F27; transform: scale(1.3); }

  #loadbar {
    width: 180px; height: 3px; border-radius: 2px;
    background: #24443b; margin: 0 auto 10px; overflow: hidden;
  }
  #loadbar i {
    display: block; height: 100%; width: 0;
    background: #1D9E75; transition: width .25s ease;
  }

  #status { font-size: 13px; color: #8fb3a8; height: 20px; margin-bottom: 12px; text-align: center; padding: 0 8px; }

  button {
    font-family: inherit; font-size: 16px; font-weight: 500;
    padding: 14px 40px; border-radius: 999px; border: none;
    background: #1D9E75; color: #fff; cursor: pointer;
    min-width: 200px; transition: transform .12s, background .2s;
  }
  button:active { transform: scale(.96); }
  button:disabled { background: #24443b; color: #6d8c82; }
  button.stop { background: #A32D2D; }

  .hints { margin-top: 16px; font-size: 11px; color: #4f6d63; text-align: center; line-height: 1.7; }

  /* 成功弹层 */
  #success {
    position: fixed; inset: 0; z-index: 200;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(11, 21, 18, .93);
    backdrop-filter: blur(6px);
  }
  #success.show { display: flex; animation: pop .35s ease; }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #success .big {
    font-size: 40px; font-weight: 500; color: #9FE1CB;
    animation: bounce .5s ease;
  }
  @keyframes bounce { 0%{transform:scale(.6)} 60%{transform:scale(1.12)} 100%{transform:scale(1)} }
  #success .times { font-size: 15px; color: #EF9F27; margin-top: 12px; }
  #success .again {
    margin-top: 28px; font-size: 15px; padding: 12px 36px;
    background: #1D9E75; color: #fff; border: none; border-radius: 999px;
  }
</style>
</head>
<body>
<canvas id="confetti"></canvas>

<header>
  <h1>报数挑战</h1>
  <div class="sub">依次报出 1 到 10 · 全程离线识别</div>
</header>

<div class="counter" id="counter">0</div>
<div class="expect" id="expect">请说出<b> 一 </b></div>
<div class="dots" id="dots"></div>
<div id="loadbar"><i></i></div>
<div id="status">点击下方按钮开始，允许麦克风权限</div>

<button id="toggle">开始报数</button>

<div class="hints">
  支持同音读法：幺/两/什等<br>
  识别在手机本地完成，不上传任何音频
</div>

<div id="success">
  <div class="big">成功一次</div>
  <div class="times" id="times">累计完成 1 次</div>
  <button class="again" id="again">再来一次</button>
</div>

<!-- 识别库已本地化：Worker 用base64 内嵌在库内，不会再发起额外请求 -->
<script src="vosk.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
